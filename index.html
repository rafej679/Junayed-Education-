<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Official Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* CSS STYLES */
    :root {
      --bg-dark: #0a0e17;
      --card-bg: rgba(22, 31, 49, 0.75);
      --primary-blue: #00d2ff;
      --secondary-blue: #3a7bd5;
      --accent-orange: #ff7b00;
      --accent-green: #00e676;
      --text-light: #f0f4f8;
      --text-dim: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 123, 0, 0.1) 0%, transparent 40%);
    }

    /* Header */
    header {
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 25px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(45deg, var(--primary-blue), #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.5px;
    }

    .nav-menu ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    .nav-menu a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-menu a:hover {
      color: var(--primary-blue);
    }

    .hamburger {
      display: none;
      font-size: 1.5rem;
      color: var(--text-light);
      cursor: pointer;
    }

    /* Hero Section */
    .hero-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 140px 20px 80px;
    }

    .hero-content {
      max-width: 800px;
    }

    .welcome-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--primary-blue);
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
      margin-bottom: 35px;
      letter-spacing: 2px;
    }

    .action-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-primary {
      background: linear-gradient(45deg, var(--secondary-blue), var(--primary-blue));
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(45deg, #11998e, var(--accent-green));
      color: #fff;
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
    }

    /* About Section */
    .about-section {
      padding: 80px 20px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .about-section h2 {
      font-size: 2.2rem;
      color: var(--primary-blue);
      margin-bottom: 20px;
    }

    .about-text {
      font-size: 1.25rem;
      color: var(--text-dim);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      margin: 60px auto;
      padding: 35px;
      max-width: 480px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      animation: modalSlide 0.3s ease;
    }

    @keyframes modalSlide {
      from { transform: translateY(-40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 24px;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.3s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .modal h3 {
      font-size: 1.6rem;
      margin-bottom: 25px;
      color: var(--primary-blue);
    }

    .info-box p {
      margin: 18px 0;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .info-box i {
      color: var(--primary-blue);
      font-size: 1.2rem;
    }

    .info-box a {
      color: var(--text-light);
      text-decoration: none;
      transition: color 0.3s;
    }

    .info-box a:hover {
      color: var(--primary-blue);
    }

    /* Forms */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--primary-blue);
    }

    .btn-submit {
      background: linear-gradient(45deg, var(--secondary-blue), var(--primary-blue));
      color: #fff;
      width: 100%;
      margin-top: 10px;
    }

    /* Footer */
    footer {
      background: #060911;
      padding: 40px 20px 25px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-follow {
      background: var(--accent-orange);
      color: #fff;
      border: none;
      padding: 12px 35px;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(255, 123, 0, 0.3);
      transition: transform 0.2s;
    }

    .btn-follow:active {
      transform: scale(0.98);
    }

    .footer-info p {
      margin: 8px 0;
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .copyright {
      margin-top: 15px !important;
      font-size: 0.85rem !important;
      color: #64748b !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hamburger { display: block; }
      .nav-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: rgba(10, 14, 23, 0.95);
        backdrop-filter: blur(15px);
        padding: 25px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .nav-menu.active { display: block; }
      .nav-menu ul { flex-direction: column; align-items: center; gap: 20px; }
      .welcome-text { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <!-- Header / Navigation Bar -->
  <header>
    <div class="nav-container">
      <div class="logo">PORTFOLIO</div>
      <nav class="nav-menu" id="navMenu">
        <ul>
          <li><a href="#home" class="nav-link">HOME</a></li>
          <li><a href="#about" class="nav-link">ABOUT</a></li>
          <li><a href="#" class="nav-link" id="navContactBtn">CONTACT US</a></li>
        </ul>
      </nav>
      <div class="hamburger" id="hamburger">
        <i class="fas fa-bars"></i>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main>
    <section id="home" class="hero-section">
      <div class="hero-content">
        <h1 class="welcome-text">WELCOME I'M</h1>
        
        <div class="action-buttons">
          <button class="btn btn-primary" id="openContactModal">CONTACT US</button>
          <button class="btn btn-secondary" id="openMessageModal">MESSAGE US</button>
        </div>
      </div>
    </section>

    <!-- About Section -->
    <section id="about" class="about-section">
      <div class="container">
        <h2>ABOUT US</h2>
        <p class="about-text">আমাদের ওয়েবসাইটে আসার জন্য আপনাকে স্বাগতম।</p>
      </div>
    </section>
  </main>

  <!-- Contact Us Modal Popup -->
  <div class="modal" id="contactModal">
    <div class="modal-content">
      <span class="close-btn" id="closeContact">&times;</span>
      <h3>Contact Information</h3>
      <div class="info-box">
        <p><i class="fas fa-phone"></i> <strong>Phone:</strong> <a href="tel:+919830507125">+91 9830507125</a></p>
        <p><i class="fas fa-envelope"></i> <strong>Email:</strong> <a href="mailto:skazim4332@gmail.com">skazim4332@gmail.com</a></p>
      </div>
    </div>
  </div>

  <!-- Message Us Modal Popup -->
  <div class="modal" id="messageModal">
    <div class="modal-content">
      <span class="close-btn" id="closeMessage">&times;</span>
      <h3>Send Us a Message</h3>
      
      <!-- Web3Forms Direct Email Service Integration -->
      <form action="https://api.web3forms.com/submit" method="POST" id="contactForm">
        <!-- Web3Forms Access Key -->
        <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">

        <div class="form-group">
          <label for="userName">YOUR NAME</label>
          <input type="text" id="userName" name="name" placeholder="আপনার নাম লিখুন" required>
        </div>

        <div class="form-group">
          <label for="userMobile">MOBILE</label>
          <input type="tel" id="userMobile" name="phone" placeholder="আপনার মোবাইল নম্বর" required>
        </div>

        <div class="form-group">
          <label for="userEmail">EMAIL</label>
          <input type="email" id="userEmail" name="email" placeholder="আপনার ইমেইল আইডি" required>
        </div>

        <div class="form-group">
          <label for="userDescribe">DESCRIBE</label>
          <textarea id="userDescribe" name="message" rows="4" placeholder="আপনি কি বলতে চান লিখুন..." required></textarea>
        </div>

        <button type="submit" class="btn btn-submit">SENT US</button>
      </form>
    </div>
  </div>

  <!-- Footer Section -->
  <footer>
    <div class="footer-container">
      <div class="follow-box">
        <button class="btn-follow">FOLLOW</button>
      </div>
      
      <div class="footer-info">
        <p><i class="fas fa-phone"></i> +91 9830507125 &nbsp;|&nbsp; <i class="fas fa-envelope"></i> skazim4332@gmail.com</p>
        <p class="copyright">2026-27© RIGHT NOW</p>
      </div>
    </div>
  </footer>

  <!-- JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const contactModal = document.getElementById('contactModal');
      const messageModal = document.getElementById('messageModal');

      const openContactModal = document.getElementById('openContactModal');
      const openMessageModal = document.getElementById('openMessageModal');
      const navContactBtn = document.getElementById('navContactBtn');

      const closeContact = document.getElementById('closeContact');
      const closeMessage = document.getElementById('closeMessage');

      const showContact = (e) => {
        e.preventDefault();
        contactModal.style.display = 'block';
      };

      openContactModal.addEventListener('click', showContact);
      navContactBtn.addEventListener('click', showContact);

      openMessageModal.addEventListener('click', () => {
        messageModal.style.display = 'block';
      });

      closeContact.addEventListener('click', () => {
        contactModal.style.display = 'none';
      });

      closeMessage.addEventListener('click', () => {
        messageModal.style.display = 'none';
      });

      window.addEventListener('click', (event) => {
        if (event.target === contactModal) contactModal.style.display = 'none';
        if (event.target === messageModal) messageModal.style.display = 'none';
      });

      const hamburger = document.getElementById('hamburger');
      const navMenu = document.getElementById('navMenu');

      hamburger.addEventListener('click', () => {
        navMenu.classList.toggle('active');
      });
    });
  </script>
</body>
</html>
